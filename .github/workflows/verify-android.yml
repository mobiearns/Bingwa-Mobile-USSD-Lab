name: Verify Android build

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK, run unit tests, and run lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      # GitHub Actions artifact storage can be full. Keep this optional so it
      # cannot turn a successful build, tests, and lint run into a failed check.
      - name: Upload debug APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
