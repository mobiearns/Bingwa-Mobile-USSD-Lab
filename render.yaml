services:
  - type: web
    name: bingwa-sms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    plan: starter
    disk:
      name: bingwa-sms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BINGWA_SMS_ADMIN_KEY
        generateValue: true
      - key: TALKSASA_API_TOKEN
        sync: false
      - key: TALKSASA_SENDER_ID
        sync: false
      - key: SQLITE_PATH
        value: /var/data/sms.sqlite
